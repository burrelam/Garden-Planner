<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4A5E3A" />
    <meta
      name="description"
      content="GardenBuddy — a private garden planting planner."
    />
    <link
      rel="icon"
      href="/brand/favicon-32.png"
      sizes="32x32"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=Pixelify+Sans:wght@500;600;700&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>GardenBuddy</title>
    <script>
      // Stamp the season before first paint, so the app never flashes the
      // wrong theme. Deliberately duplicates the small amount of logic in
      // src/theme.ts (seasonForDate / readThemePreference) because this has
      // to run before any module loads — keep the two in step.
      (function () {
        var ids = ["fall", "winter", "spring", "summer", "night"];
        var preference = "auto";
        try {
          var stored = localStorage.getItem("gardenbuddy.theme");
          if (stored === "auto" || ids.indexOf(stored) > -1)
            preference = stored;
        } catch (error) {
          /* private windows can throw; auto is a fine default */
        }
        var theme = preference;
        if (preference === "auto") {
          var now = new Date();
          var month = now.getMonth() + 1;
          var day = now.getDate();
          var starts = [
            [3, 20, "spring"],
            [6, 21, "summer"],
            [9, 22, "fall"],
            [12, 21, "winter"],
          ];
          theme = "winter";
          for (var i = 0; i < starts.length; i++) {
            if (
              month > starts[i][0] ||
              (month === starts[i][0] && day >= starts[i][1])
            ) {
              theme = starts[i][2];
            }
          }
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
